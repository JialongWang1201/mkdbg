name: Release

# Runs only after CI completes. Main updates the rolling "latest" pre-release;
# version tags create immutable versioned releases.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch == 'main' && 'latest' || github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.head_branch == 'main' }}

permissions:
  contents: write

jobs:
  # ── Build matrix ────────────────────────────────────────────────────────────
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch != 'main' ||
       github.event.workflow_run.head_sha == github.sha)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64

          - runner: ubuntu-22.04
            os: linux
            arch: arm64
            cross: true

          - runner: macos-latest    # cross-compile x86_64 from Apple Silicon
            os: darwin
            arch: x86_64
            osx_arch: x86_64

          - runner: macos-latest    # Apple Silicon
            os: darwin
            arch: arm64

    runs-on: ${{ matrix.runner }}
    name: build-${{ matrix.os }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(tr -d '[:space:]' < VERSION)"
          source_ref="${{ github.event.workflow_run.head_branch }}"
          if [[ ! "${source_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: invalid VERSION: ${source_version}" >&2
            exit 1
          fi
          if [[ "${source_ref}" == v* && "${source_ref}" != "v${source_version}" ]]; then
            echo "error: tag ${source_ref} does not match VERSION ${source_version}" >&2
            exit 1
          fi

      - name: Install cross-compiler (linux-arm64)
        if: matrix.cross == true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Rust is needed for probe-bridge on native builds.
      # Cross-compile legs skip probe support (MKDBG_SKIP_PROBE=ON) to avoid
      # requiring a cross-Rust toolchain in CI.
      - name: Install libudev-dev (Linux native, required by probe-rs)
        if: "matrix.os == 'linux' && !matrix.cross"
        run: sudo apt-get update -q && sudo apt-get install -y libudev-dev

      - name: Install Rust toolchain (native builds)
        if: "!matrix.cross"
        run: rustup toolchain install stable --no-self-update

      # macOS x86_64 is cross-compiled from the arm64 runner; add the x86_64
      # Rust target so cargo produces a compatible static lib.
      - name: Add x86_64-apple-darwin Rust target (darwin-x86_64 leg)
        if: matrix.osx_arch == 'x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Configure (native)
        if: "!matrix.cross"
        run: |
          OSX_ARCH="${{ matrix.osx_arch }}"
          if [[ -n "${OSX_ARCH}" ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="${OSX_ARCH}"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Configure (cross linux-arm64)
        if: matrix.cross == true
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DMKDBG_SKIP_LG2=ON \
            -DMKDBG_SKIP_PROBE=ON

      - name: Build
        run: cmake --build build --target mkdbg-native

      - name: Stage and strip artifact
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          artifact="mkdbg-native-${{ matrix.os }}-${{ matrix.arch }}"
          cp build/mkdbg-native "${artifact}"
          if [[ "${{ matrix.os }}" == "darwin" ]]; then
            strip -x "${artifact}"
          elif [[ "${{ matrix.cross }}" == "true" ]]; then
            aarch64-linux-gnu-strip --strip-all "${artifact}"
          else
            strip --strip-all "${artifact}"
          fi

          source_ref="${{ github.event.workflow_run.head_branch }}"
          if [[ "${{ matrix.os }}" == "darwin" && "${source_ref}" == v* ]]; then
            for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
                        MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID \
                        APPLE_APP_PASSWORD; do
              if [[ -z "${!name:-}" ]]; then
                echo "error: ${name} is required for a versioned macOS release" >&2
                exit 1
              fi
            done

            certificate_path="${RUNNER_TEMP}/mkdbg-signing.p12"
            keychain_path="${RUNNER_TEMP}/mkdbg-signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            cleanup_signing() {
              security delete-keychain "${keychain_path}" >/dev/null 2>&1 || true
              rm -f "${certificate_path}"
            }
            trap cleanup_signing EXIT

            printf '%s' "${MACOS_CERTIFICATE_P12}" | /usr/bin/base64 -D > "${certificate_path}"
            security create-keychain -p "${keychain_password}" "${keychain_path}"
            security set-keychain-settings -lut 21600 "${keychain_path}"
            security unlock-keychain -p "${keychain_password}" "${keychain_path}"
            security import "${certificate_path}" -k "${keychain_path}" \
              -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "${keychain_password}" "${keychain_path}"

            codesign --force --options runtime --timestamp \
              --keychain "${keychain_path}" \
              --sign "${MACOS_SIGNING_IDENTITY}" "${artifact}"
            codesign --verify --strict --verbose=2 "${artifact}"
            ditto -c -k --keepParent "${artifact}" "${artifact}.zip"
            xcrun notarytool submit "${artifact}.zip" \
              --apple-id "${APPLE_ID}" \
              --team-id "${APPLE_TEAM_ID}" \
              --password "${APPLE_APP_PASSWORD}" \
              --wait
            spctl --assess --type execute --verbose=2 "${artifact}"
          fi
          wc -c "${artifact}"

      - uses: actions/upload-artifact@v4
        with:
          name: mkdbg-native-${{ matrix.os }}-${{ matrix.arch }}
          path: mkdbg-native-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error

  # ── Publish release ─────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Determine release tag
        id: tag
        run: |
          SOURCE_REF="${{ github.event.workflow_run.head_branch }}"
          if [[ "${SOURCE_REF}" == v* ]]; then
            echo "name=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"              >> "$GITHUB_OUTPUT"
          elif [[ "${SOURCE_REF}" == "main" ]]; then
            echo "name=latest"    >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "error: unsupported release ref ${SOURCE_REF}" >&2
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum mkdbg-native-* > SHA256SUMS

      - name: Delete existing 'latest' release before overwriting
        if: steps.tag.outputs.name == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO:  ${{ github.repository }}
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO:  ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
            exit 0
          fi

          release_args=(
            "${tag}"
            --target "${SOURCE_SHA}"
            --title "mkdbg ${tag}"
            --notes "Built from \`${SOURCE_SHA:0:7}\` on \`${SOURCE_REF}\`"
          )
          if [[ "${{ steps.tag.outputs.prerelease }}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}" dist/*
